name: Build PicApport Matrix and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 0'

jobs:
  # Job 1: Validiert das Dockerfile parallel zu discover-versions
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
          failure-threshold: error

  # Job 2: Läuft parallel zu lint-dockerfile (needs wurde entfernt)
  discover-versions:
    runs-on: ubuntu-latest
    outputs:
      version_matrix: ${{ steps.get-versions.outputs.versions }}
      latest_version: ${{ steps.get-versions.outputs.latest }}
      is_fallback: ${{ steps.get-versions.outputs.fallback }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch and Filter Latest 3 Versions
        id: get-versions
        run: |
          # Holt die Download-Seite und extrahiert Versionsnummern im Format X-X-XX (z.B. 10-2-02 oder 10-4-00)
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               https://picapport.de/de/photo-server-download.php --silent | \
          grep -oE '[0-9]+-[0-9]+-[0-9a-zA-Z_]+' | sort -V -r | uniq > all.vers
          
          if [ ! -s all.vers ]; then
            echo "WARNUNG: Konnte Webseite nicht auslesen. Nutze Version aus Dockerfile als Fallback."
            DOCKERFILE_VER=$(grep -E '^ARG VERSION=' Dockerfile | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
            echo "$DOCKERFILE_VER" > all.vers
            echo "fallback=true" >> $GITHUB_OUTPUT
          else
            echo "fallback=false" >> $GITHUB_OUTPUT
          fi
          
          LATEST_VER=$(head -n 1 all.vers)
          echo "latest=$LATEST_VER" >> $GITHUB_OUTPUT
          
          head -n 3 all.vers > filtered.vers
          
          echo "=== Gefundene Top 3 Versionen für den Build ==="
          cat filtered.vers
          echo "================================================"
          
          JSON_ARRAY=$(cat filtered.vers | jq -R . | jq -s -c .)
          echo "versions=$JSON_ARRAY" >> $GITHUB_OUTPUT

  # Job 3: Wartet, bis Linting UND Version-Discovery erfolgreich abgeschlossen sind
  build-matrix:
    runs-on: ubuntu-latest
    needs: [lint-dockerfile, discover-versions]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover-versions.outputs.version_matrix) }}
        release: ["picapport-headless", "picapport"]
        openjdk: ["default-jre"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download PicApport Jar
        run: |
          # Verwendet die offizielle Download-URL-Struktur von PicApport
          curl -L 'https://www.picapport.de/download/${{ matrix.version }}/${{ matrix.release }}.jar' \
            --output './${{ matrix.release }}-${{ matrix.version }}.jar'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Tags
        id: docker_tags
        run: |
          TAGS="bksolutions/picapport:${{ matrix.version }}-${{ matrix.release }}"
          
          if [ "${{ needs.discover-versions.outputs.is_fallback }}" = "false" ]; then
            if [ "${{ matrix.version }}" = "${{ needs.discover-versions.outputs.latest_version }}" ]; then
              if [ "${{ matrix.release }}" = "picapport" ]; then
                TAGS="$TAGS,bksolutions/picapport:latest"
              elif [ "${{ matrix.release }}" = "picapport-headless" ]; then
                TAGS="$TAGS,bksolutions/picapport:latest-headless"
              fi
            fi
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/386,linux/arm/v7,linux/arm64
          push: true
          build-args: |
            VERSION=${{ matrix.version }}
            RELEASE=${{ matrix.release }}
            OPENJDK=${{ matrix.openjdk }}
          tags: ${{ steps.docker_tags.outputs.tags }}

  update-readme:
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: bksolutions/picapport
