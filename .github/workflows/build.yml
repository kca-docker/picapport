name: Build PicApport Matrix and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 0'

jobs:
  discover-versions:
    runs-on: ubuntu-latest
    outputs:
      version_matrix: ${{ steps.get-versions.outputs.versions }}
      latest_version: ${{ steps.get-versions.outputs.latest }}
      is_fallback: ${{ steps.get-versions.outputs.fallback }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch and Filter Latest 3 Versions
        id: get-versions
        run: |
          # 1. Alle verfügbaren Versionen über ein robusteres Regex-Muster auslesen
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               https://picapport.de --silent | \
          sed -En "s/.*dlfile=([0-9a-zA-Z_-]+)%[fF]2.*/\1/p" | sort -V -r | uniq > all.vers
          
          # 2. Sicherheits-Fallback: Falls Webseite blockiert oder Struktur geändert, Dockerfile nutzen
          if [ ! -s all.vers ]; then
            echo "WARNUNG: Konnte Webseite nicht auslesen. Nutze Version aus Dockerfile als Fallback."
            DOCKERFILE_VER=$(grep -E '^ARG VERSION=' Dockerfile | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
            echo "$DOCKERFILE_VER" > all.vers
            echo "fallback=true" >> $GITHUB_OUTPUT
          else
            echo "fallback=false" >> $GITHUB_OUTPUT
          fi
          
          # 3. Die allerneueste Version wegspeichern (erste Zeile)
          LATEST_VER=$(head -n 1 all.vers)
          echo "latest=$LATEST_VER" >> $GITHUB_OUTPUT
          echo "Die ermittelte Version ist: $LATEST_VER"
          
          # 4. Die Top 3 für die Matrix herausfiltern und in JSON umwandeln
          head -n 3 all.vers > filtered.vers
          JSON_ARRAY=$(cat filtered.vers | jq -R . | jq -s -c .)
          echo "versions=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build-matrix:
    runs-on: ubuntu-latest
    needs: discover-versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover-versions.outputs.version_matrix) }}
        release: ["picapport-headless", "picapport"]
        openjdk: ["default-jre"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Gelöst: Variablen werden als Umgebungsvariablen übergeben (kein geschachtelter Klammerfehler mehr bei curl)
      - name: Download PicApport Jar
        env:
          PV_VERSION: ${{ matrix.version }}
          PV_RELEASE: ${{ matrix.release }}
        run: |
          curl "https://picapport.de{PV_VERSION}/${PV_RELEASE}.jar" \
            --output "./${PV_RELEASE}-${PV_VERSION}.jar"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Tags
        id: docker_tags
        run: |
          TAGS="bksolutions/picapport:${{ matrix.version }}-${{ matrix.release }}"
          
          if [ "${{ needs.discover-versions.outputs.is_fallback }}" = "false" ]; then
            if [ "${{ matrix.version }}" = "${{ needs.discover-versions.outputs.latest_version }}" ]; then
              if [ "${{ matrix.release }}" = "picapport" ]; then
                TAGS="$TAGS,bksolutions/picapport:latest"
              elif [ "${{ matrix.release }}" = "picapport-headless" ]; then
                TAGS="$TAGS,bksolutions/picapport:latest-headless"
              fi
            fi
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/386,linux/arm/v7,linux/arm64
          push: true
          build-args: |
            VERSION=${{ matrix.version }}
            RELEASE=${{ matrix.release }}
            OPENJDK=${{ matrix.openjdk }}
          tags: ${{ steps.docker_tags.outputs.tags }}

  update-readme:
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: bksolutions/picapport
